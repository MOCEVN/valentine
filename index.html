<!doctype html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shar #1</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <h1>Will you be my valentine?</h1>
    </header>

    <main>
      <section id="home">
        <div class="question-container">
          <p class="question">Wil je mijn valentijn zijn? 💕</p>
          <div class="buttons-container">
            <button id="yesButton" class="yes-btn">Ja! ❤️</button>
            <button id="noButton" class="no-btn">Nee</button>
          </div>
          <p id="response" class="response hidden"></p>
        </div>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
